<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guardian</title>
<style>
  :root { --bg: #f6f5fb; --card: #fff; --text: #1e1b2e; --muted: #6b6880; --accent: #6d4aff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #13111c; --card: #1d1a29; --text: #ece9f6; --muted: #a29eb8; --accent: #9b85ff; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 64px auto; padding: 24px 16px; background: var(--card); border-radius: 14px; }
  a { color: var(--accent); }
</style>
</head>
<body><main>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <p><a href="/">← Back to Guardian</a></p>
</main></body>
</html>
