name: 🐛 Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part of Guardian?
      options: [Web app, Always-on protection, Browser extension, Weekly email, MCP server, Install / setup]
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Which platform?
      multiple: true
      options: [YouTube, Instagram, TikTok, X, Not platform-specific]
  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      description: Please remove any API keys or tokens before pasting.
      render: text
